plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.repitchaudio'
version = '0.1.0'

android {
  namespace "expo.modules.repitchaudio"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        // Static STL: the JNI surface is plain C, nothing crosses the library boundary.
        // FLEXIBLE_PAGE_SIZES: 16 KB aligned .so (required for targetSdk 35+ on 16 KB devices).
        arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  // Asked for BeatThis.onnx to be stored uncompressed (the app module's own aapt settings win, so nothing relies on it).
  androidResources {
    noCompress += ["onnx"]
  }

  lint {
    abortOnError false
  }
}

dependencies {
  def media3Version = "1.8.0"
  implementation "androidx.media3:media3-exoplayer:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"
  // ListenableFuture (MediaController.buildAsync) and ContextCompat.
  implementation "com.google.guava:guava:33.4.8-android"
  implementation "androidx.core:core-ktx:1.15.0"
  // Beat This! network (src/main/assets/BeatThis.onnx), CPU execution provider.
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.23.2"
}
